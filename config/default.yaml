# TUI Agent 默认配置
# 项目级配置 (.tui-agent.yaml) > 用户级配置 (~/.tui-agent.yaml) > 本文件

provider: openai_compat
model: gpt-4o-mini
api_base: https://api.openai.com/v1
timeout: 120
max_turns: 50
max_retries: 3
context_max_tokens: 32000

# /model 命令可切换的模型列表（可按所用 API 提供商修改）
available_models:
  - gpt-4o-mini
  - gpt-4o
  - deepseek-chat
