# TUI Agent 配置示例（复制为 .tui-agent.yaml 后生效）
# 内置默认值由 src/tui_agent/config/schema.py 定义，本文件不参与运行时加载

max_turns: 50
context_max_tokens: 32000

# /model 命令可切换的模型列表（可按所用 API 提供商修改）
available_models:
  - gpt-4o-mini
  - gpt-4o
  - claude-sonnet-4-5
  - deepseek-chat

llm:
  # openai_compat | anthropic
  provider: openai_compat
  model: gpt-4o-mini
  api_base: https://api.openai.com/v1
  timeout: 120
  max_retries: 3
